name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Requires Settings → Pages → Source: GitHub Actions.
# Publishes only the static export from ./out (never the repo root / README).
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      base_path: ${{ steps.base.outputs.base_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Resolves the Pages base path when Source is GitHub Actions.
      # If unavailable, fall back to /BayhanGame for project sites.
      - name: Configure GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Resolve base path
        id: base
        shell: bash
        run: |
          BASE="${{ steps.pages.outputs.base_path }}"
          # Project site https://apex3488.github.io/BayhanGame/ must use /BayhanGame
          if [ -z "$BASE" ] || [ "$BASE" = "/" ]; then
            BASE="/BayhanGame"
          fi
          # normalize: leading slash, no trailing slash
          BASE="/${BASE#/}"
          BASE="${BASE%/}"
          echo "base_path=$BASE" >> "$GITHUB_OUTPUT"
          echo "Using NEXT_PUBLIC_BASE_PATH=$BASE"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

      # Prefer Actions variables; fall back to committed .env.production so Telegram
      # builds never ship without NEXT_PUBLIC_GAME_API_URL / anon key.
      - name: Resolve public env
        id: env
        shell: bash
        env:
          VAR_BOT_USERNAME: ${{ vars.NEXT_PUBLIC_TELEGRAM_BOT_USERNAME }}
          VAR_DATA_SOURCE: ${{ vars.NEXT_PUBLIC_DATA_SOURCE }}
          VAR_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          VAR_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          VAR_SUPABASE_FUNCTION_NAME: ${{ vars.NEXT_PUBLIC_SUPABASE_FUNCTION_NAME }}
          VAR_GAME_API_URL: ${{ vars.NEXT_PUBLIC_GAME_API_URL }}
        run: |
          set -euo pipefail
          if [ -f .env.production ]; then
            set -a
            # shellcheck disable=SC1091
            source .env.production
            set +a
          fi
          out() {
            local key="$1"
            local val="$2"
            # Heredoc so JWT '=' padding cannot break GITHUB_OUTPUT.
            {
              echo "${key}<<EOF"
              echo "${val}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          }
          out BOT_USERNAME "${VAR_BOT_USERNAME:-${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME:-}}"
          out DATA_SOURCE "${VAR_DATA_SOURCE:-${NEXT_PUBLIC_DATA_SOURCE:-api}}"
          out SUPABASE_URL "${VAR_SUPABASE_URL:-${NEXT_PUBLIC_SUPABASE_URL:-}}"
          out SUPABASE_ANON_KEY "${VAR_SUPABASE_ANON_KEY:-${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}}"
          out SUPABASE_FUNCTION_NAME "${VAR_SUPABASE_FUNCTION_NAME:-${NEXT_PUBLIC_SUPABASE_FUNCTION_NAME:-bayhan-api}}"
          out GAME_API_URL "${VAR_GAME_API_URL:-${NEXT_PUBLIC_GAME_API_URL:-}}"
          test -n "${VAR_GAME_API_URL:-${NEXT_PUBLIC_GAME_API_URL:-}}"
          test -n "${VAR_SUPABASE_ANON_KEY:-${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}}"

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.base_path }}
          # Public only — never put BOT_TOKEN or service_role here.
          NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${{ steps.env.outputs.BOT_USERNAME }}
          NEXT_PUBLIC_DATA_SOURCE: ${{ steps.env.outputs.DATA_SOURCE }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.env.outputs.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.env.outputs.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_FUNCTION_NAME: ${{ steps.env.outputs.SUPABASE_FUNCTION_NAME }}
          NEXT_PUBLIC_GAME_API_URL: ${{ steps.env.outputs.GAME_API_URL }}

      - name: Verify static export
        run: npm run verify:export
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.base_path }}

      - name: Ensure .nojekyll
        run: |
          test -f out/index.html
          test -f out/.nojekyll || touch out/.nojekyll
          # Guard: exported HTML must reference the repo base path, not bare /_next
          grep -q "${{ steps.base.outputs.base_path }}/_next/" out/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
